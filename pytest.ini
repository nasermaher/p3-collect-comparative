[pytest]
# Explicit --basetemp bypasses pytest's default pytest-of-<user>/pytest-N
# retention + pytest-current symlink under the OS temp dir. On at least one
# dev machine that symlink was already broken (stale, access denied) before
# this project existed, which made every pytest run exit non-zero at
# teardown even when every test passed. A local basetemp sidesteps it.
addopts = --basetemp=.pytest_tmp
